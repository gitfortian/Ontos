server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ontos
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

ontos:
  datasource:
    system:
      jdbc-url: ${ONTOS_SYSTEM_DB_URL:jdbc:postgresql://localhost:5432/ontos}
      username: ${ONTOS_SYSTEM_DB_USER:postgres}
      password: ${ONTOS_SYSTEM_DB_PASSWORD:123456}
      maximum-pool-size: 12
      minimum-idle: 2
      pool-name: ontos-system
      connection-timeout: 5000
    query:
      jdbc-url: ${ONTOS_QUERY_DB_URL:jdbc:postgresql://localhost:5432/ontos_queryds}
      username: ${ONTOS_QUERY_DB_USER:ontos_query_ro}
      password: ${ONTOS_QUERY_DB_PASSWORD:ontos_query_ro}
      maximum-pool-size: 16
      minimum-idle: 2
      pool-name: ontos-query
      read-only: true
      connection-timeout: 5000
  agent:
    enabled: ${ONTOS_AGENT_ENABLED:true}
    # 标准 OpenAI 三件套：模型名 + 兼容端点 + 密钥。不绑定厂商，换端点即换供应商。
    # 凭据只走环境变量；缺失时确定性链路照常启动，AG-UI 调用会给出明确错误。
    model: ${ONTOS_AGENT_MODEL:gpt-4o-mini}
    base-url: ${ONTOS_AGENT_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
    api-key: ${ONTOS_AGENT_API_KEY:${OPENAI_API_KEY:}}
    workspace: ${ONTOS_AGENT_WORKSPACE:.agentscope/workspace}
    system-prompt: classpath:prompts/system.md
    max-iters: 12
  query:
    max-rows: 500
    statement-timeout: PT15S
    max-batch-size: 50
  manifest:
    startup-load: true
  policy:
    # 生产必须保持 false；默认 fail-closed
    dev-allow-all: false
  web:
    security:
      # 生产必须保持 false；身份由认证网关注入
      dev-headers: false
    cors:
      # 开发环境两种写法都可能出现：浏览器按地址栏原样带 Origin，
      # localhost 与 127.0.0.1 在 CORS 里是两个不同的源，只配一个会导致 AG-UI 403。
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173

agentscope:
  agui:
    path-prefix: /agent
    default-agent-id: ontos
    run-timeout: PT5M
    emit-tool-call-args: true
    emit-token-usage: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.ontos: INFO
    org.jooq: WARN
